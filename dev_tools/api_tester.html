<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>API Tester</title>
    
</head>

<body>
    <div class="container">
        <h1>External API Dashboard Tester</h1>
        <p>Because the API is secured, you can't just open it by typing the URL in the browser directly. You need an
            interface that passes the Secret API Key. Test it here:</p>

        <label><b>API Key:</b></label>
        <input type="text" id="apiKey" class="key-input" value="test-key-12345">

        <button onclick="fetchAPI('employees.php')">Fetch Employees</button>
        <button onclick="fetchAPI('attendance.php')">Fetch Attendance logs</button>

        <textarea id="output" placeholder="Output will appear here..." readonly></textarea>
    </div>

    <script>
        function fetchAPI(endpoint) {
            const key = document.getElementById('apiKey').value;
            const outputBox = document.getElementById('output');
            outputBox.value = "Fetching data...";

            fetch("api/v1/" + endpoint, {
                method: "GET",
                headers: {
                    "X-API-Key": key
                }
            })
                .then(async response => {
                    const data = await response.json();
                    outputBox.value = JSON.stringify(data, null, 4);
                })
                .catch(error => {
                    outputBox.value = "Error: " + error;
                });
        }
    </script>
</body>

</html>
