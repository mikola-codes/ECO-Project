<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOZONE - Attendance Logs</title>
    <meta name="description" content="ECOZONE Attendance Logs Dashboard.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .holiday-banner {
            display: none;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: #fff;
            text-align: center;
            padding: 10px 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 12px rgba(255, 107, 53, 0.35);
            animation: bannerSlideIn 0.4s ease;
        }

        .holiday-banner.special {
            background: linear-gradient(135deg, #6a3de8 0%, #4f46e5 100%);
            box-shadow: 0 2px 12px rgba(79, 70, 229, 0.35);
        }

        @keyframes bannerSlideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .holiday-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .holiday-badge-regular {
            background: #fff3e0;
            color: #e65100;
        }

        .holiday-badge-special {
            background: #ede7f6;
            color: #5e35b1;
        }

        .holiday-badge-working {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .holiday-badge-company {
            background: #e3f2fd;
            color: #0277bd;
        }

        .duty-badge-sm {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase
        }

        .duty-field-sm {
            background: #fef3c7;
            color: #92400e
        }

        .duty-task-sm {
            background: #dbeafe;
            color: #1e40af
        }

        .duty-official-sm {
            background: #e0e7ff;
            color: #3730a3
        }

        .duty-excused-sm {
            background: #fce7f3;
            color: #9d174d
        }

        .duty-override-sm {
            background: #fee2e2;
            color: #991b1b
        }
    </style>
</head>

<body>

    <!-- Holiday Banner -->
    <div id="holidayBanner" class="holiday-banner">
        <span>🏖️</span>
        <span id="holidayBannerText"></span>
    </div>

    <!-- Header -->
    <div class="brand-header">
        <img src="assets/images/logo.jpg" alt="ECOZONE Logo" class="brand-logo">
        <h1>ECOZONE</h1>
        <div class="subtitle">Attendance Logs</div>
        <div id="liveClock" class="live-clock"></div>
    </div>

    <div class="main-container main-container-wide">
        <div class="mb-4" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <a href="index.html" class="nav-link-back">&larr; Back to Main</a>
            <a href="admin.html" id="adminPanelBtn" onclick="promptAdminPassword(event)" style="
                display:inline-flex;align-items:center;gap:8px;
                background:linear-gradient(135deg,#1a3c2a,#2d5a3d);
                color:#fff;text-decoration:none;
                padding:10px 22px;border-radius:14px;
                font-family:'Outfit',sans-serif;font-weight:700;font-size:14px;
                box-shadow:0 4px 14px rgba(26,60,42,.3);
                transition:all .25s ease;letter-spacing:.01em;">
                🛡️ Admin Panel
            </a>
        </div>

        <!-- Filters -->
        <div class="filter-bar">
            <div class="filter-group">
                <label for="dateFilter" class="filter-label">Filter by Date</label>
                <input type="date" id="dateFilter" class="form-control form-control-sm filter-input">
            </div>
            <div class="filter-group">
                <label for="searchFilter" class="filter-label">Search Nickname</label>
                <input type="text" id="searchFilter" class="form-control form-control-sm filter-input"
                    placeholder="Type a nickname...">
            </div>
            <div class="filter-group filter-actions">
                <button id="clearFilters" class="btn btn-clear">Clear Filters</button>
            </div>
        </div>

        <!-- Attendance Table -->
        <div class="table-card">
            <div class="table-header-bar">
                <h5>
                    Attendance Records
                    <span id="recordCount" class="record-count-badge"></span>
                </h5>
            </div>
            <div class="table-responsive">
                <table class="table" id="attendanceTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nickname</th>
                            <th>Date &amp; Time</th>
                            <th>Status</th>
                            <th>Holiday</th>
                            <th>Duty</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                    </tbody>
                </table>
            </div>
            <p id="statusMessage" class="text-center mb-0">
                <span class="spinner"></span> Loading records...
            </p>
        </div>

        <div class="footer-text">ECOZONE Attendance System &copy; 2026</div>
    </div>

    <script src="libs/bootstrap.bundle.min.js"></script>
    <script>
        // Holiday Banner
        var holidayBanner = document.getElementById('holidayBanner');
        var holidayBannerText = document.getElementById('holidayBannerText');
        fetch('api/holidays.php?check_today=1')
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (d.is_holiday) {
                    holidayBannerText.textContent = 'TODAY IS A ' + d.holiday_type.replace(/_/g, ' ') + ' HOLIDAY — ' + d.holiday_name;
                    holidayBanner.style.display = 'block';
                    if (d.holiday_type !== 'REGULAR') holidayBanner.classList.add('special');
                }
            })
            .catch(function () { });

        // Timer
        var clockDisplay = document.getElementById('liveClock');
        function updateClock() {
            var now = new Date();
            var dateStr = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            var timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            clockDisplay.textContent = dateStr + '  •  ' + timeStr;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Elements
        var tableBody = document.getElementById('logTableBody');
        var statusMsg = document.getElementById('statusMessage');
        var countBadge = document.getElementById('recordCount');
        var dateFilter = document.getElementById('dateFilter');
        var searchFilter = document.getElementById('searchFilter');
        var clearBtn = document.getElementById('clearFilters');

        var allRecords = [];

        // Fetch attendance
        function loadAttendance(date) {
            tableBody.innerHTML = '';
            statusMsg.innerHTML = '<span class="spinner"></span> Loading records...';
            statusMsg.style.display = 'block';

            var url = 'api/get_attendance.php';
            if (date) url += '?date=' + date;

            fetch(url)
                .then(function (res) { return res.json(); })
                .then(function (records) {
                    allRecords = records;
                    renderRecords(allRecords);
                })
                .catch(function (err) {
                    statusMsg.textContent = 'Error loading records: ' + err;
                    statusMsg.style.display = 'block';
                    countBadge.textContent = '';
                });
        }

        // Render table
        function renderRecords(records) {
            tableBody.innerHTML = '';

            if (records.length === 0) {
                statusMsg.textContent = 'No attendance records found.';
                statusMsg.style.display = 'block';
                countBadge.textContent = '0';
                return;
            }

            statusMsg.style.display = 'none';
            countBadge.textContent = records.length;

            for (var i = 0; i < records.length; i++) {
                var r = records[i];
                var row = document.createElement('tr');

                var idCell = document.createElement('td');
                idCell.textContent = r.employee_id;
                idCell.className = 'cell-id';

                var nickCell = document.createElement('td');
                nickCell.textContent = r.nickname;
                nickCell.className = 'cell-name';

                var timeCell = document.createElement('td');
                timeCell.textContent = r.log_time;

                var statusCell = document.createElement('td');
                var logType = r.log_type || 'TIME_IN';
                var badge = document.createElement('span');
                badge.className = 'log-badge log-badge-' + logType.toLowerCase();
                badge.textContent = logType === 'TIME_IN' ? 'TIME IN' : 'TIME OUT';
                statusCell.appendChild(badge);

                var holidayCell = document.createElement('td');
                if (r.holiday_flag) {
                    var hBadge = document.createElement('span');
                    var hClass = {
                        'REGULAR': 'holiday-badge holiday-badge-regular',
                        'SPECIAL_NON_WORKING': 'holiday-badge holiday-badge-special',
                        'SPECIAL_WORKING': 'holiday-badge holiday-badge-working',
                        'COMPANY': 'holiday-badge holiday-badge-company'
                    }[r.holiday_flag] || 'holiday-badge holiday-badge-company';
                    hBadge.className = hClass;
                    hBadge.title = r.holiday_name || r.holiday_flag;
                    hBadge.textContent = '🏖️ ' + r.holiday_flag.replace(/_/g, ' ');
                    holidayCell.appendChild(hBadge);
                } else {
                    holidayCell.textContent = '—';
                    holidayCell.className = 'text-muted';
                }

                var dutyCell = document.createElement('td');
                if (r.duty_status) {
                    var dBadge = document.createElement('span');
                    var dClass = {
                        'ON_FIELD_DUTY': 'duty-badge-sm duty-field-sm',
                        'COMPANY_TASK': 'duty-badge-sm duty-task-sm',
                        'OFFICIAL_BUSINESS': 'duty-badge-sm duty-official-sm',
                        'LATE_EXCUSED': 'duty-badge-sm duty-excused-sm',
                        'ADMIN_OVERRIDE': 'duty-badge-sm duty-override-sm'
                    }[r.duty_status] || 'duty-badge-sm duty-field-sm';
                    dBadge.className = dClass;
                    dBadge.textContent = r.duty_status.replace(/_/g, ' ');
                    if (r.duty_reason) dBadge.title = r.duty_reason;
                    dutyCell.appendChild(dBadge);
                } else {
                    dutyCell.textContent = '—';
                    dutyCell.className = 'text-muted';
                }

                row.appendChild(idCell);
                row.appendChild(nickCell);
                row.appendChild(timeCell);
                row.appendChild(statusCell);
                row.appendChild(holidayCell);
                row.appendChild(dutyCell);
                tableBody.appendChild(row);
            }
        }

        // Search filter
        searchFilter.addEventListener('input', function () {
            var term = this.value.toLowerCase().trim();
            if (!term) { renderRecords(allRecords); return; }
            var filtered = allRecords.filter(function (r) {
                return r.nickname.toLowerCase().indexOf(term) !== -1;
            });
            renderRecords(filtered);
        });

        // Date filter
        dateFilter.addEventListener('change', function () {
            searchFilter.value = '';
            loadAttendance(this.value);
        });

        // Clear
        clearBtn.addEventListener('click', function () {
            dateFilter.value = '';
            searchFilter.value = '';
            loadAttendance('');
        });

        // Initial load
        loadAttendance('');

        // Admin Panel Password Prompt
        function promptAdminPassword(e) {
            e.preventDefault();
            var pwd = prompt('Enter Admin Password:');
            if (pwd === null) return;
            fetch('api/admin_auth.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) })
                .then(function (r) { return r.json() })
                .then(function (d) {
                    if (d.success) {
                        sessionStorage.setItem('eco_admin', '1');
                        window.location.href = 'admin.html';
                    } else {
                        alert('Incorrect Password');
                    }
                }).catch(function (err) {
                    alert('Connection error: ' + err);
                });
        }
    </script>
</body>

</html>
