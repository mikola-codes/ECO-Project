<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOZONE - Holiday Management (Admin)</title>
    <meta name="description" content="ECOZONE Admin — Manage holidays for the attendance system.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* ── Login Gate ────────────────────────────── */
        .login-gate {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
        }

        .login-card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(30, 60, 40, 0.10);
            padding: 50px 45px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .login-title {
            font-size: 22px;
            font-weight: 800;
            color: #1a3c2a;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #a0bba6;
            font-weight: 600;
            margin-bottom: 28px;
        }

        .login-input {
            border: 2px solid #e1efe5;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            color: #1a3c2a;
            width: 100%;
            outline: none;
            transition: border-color 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }

        .login-input:focus {
            border-color: #2bcf74;
        }

        .login-btn {
            margin-top: 18px;
            background: linear-gradient(135deg, #2bcf74 0%, #1db954 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            padding: 16px 50px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }

        .login-btn:hover {
            background: #25bb67;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(43, 207, 116, 0.35);
        }

        .login-btn:disabled {
            background: #e1efe5;
            color: #a0bba6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        .login-error {
            color: #d90429;
            font-size: 13px;
            font-weight: 600;
            margin-top: 14px;
            min-height: 20px;
        }

        /* ── Admin Panel ───────────────────────────── */
        .admin-panel {
            display: none;
        }

        /* Holiday Today Notice */
        .holiday-today-card {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: #fff;
            border-radius: 18px;
            padding: 18px 28px;
            margin-bottom: 22px;
            font-weight: 600;
            font-size: 0.95rem;
            display: none;
            animation: fadeUp 0.4s ease;
            box-shadow: 0 4px 18px rgba(255, 107, 53, 0.25);
        }

        .holiday-today-card.special {
            background: linear-gradient(135deg, #6a3de8 0%, #4f46e5 100%);
            box-shadow: 0 4px 18px rgba(79, 70, 229, 0.25);
        }

        /* Add Holiday Form */
        .add-form-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(30, 60, 40, 0.08);
            margin-bottom: 22px;
            overflow: hidden;
        }

        .add-form-header {
            background: linear-gradient(135deg, #2bcf74 0%, #1db954 100%);
            padding: 18px 28px;
            color: #fff;
            font-weight: 700;
            font-size: 17px;
        }

        .add-form-body {
            padding: 25px 28px 30px;
        }

        .form-row-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 14px;
            align-items: end;
        }

        @media (max-width: 768px) {
            .form-row-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group-mini label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #5c8068;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .form-group-mini input,
        .form-group-mini select {
            border: 2px solid #e1efe5;
            border-radius: 12px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #1a3c2a;
            width: 100%;
            outline: none;
            transition: border-color 0.3s ease;
            font-family: 'Outfit', sans-serif;
            background: #fff;
        }

        .form-group-mini input:focus,
        .form-group-mini select:focus {
            border-color: #2bcf74;
        }

        .btn-add {
            background: linear-gradient(135deg, #2bcf74 0%, #1db954 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
            white-space: nowrap;
        }

        .btn-add:hover {
            background: #25bb67;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(43, 207, 116, 0.3);
        }

        .btn-add:disabled {
            background: #e1efe5;
            color: #a0bba6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        .add-message {
            font-size: 13px;
            font-weight: 600;
            margin-top: 12px;
            min-height: 18px;
        }

        .add-message.success {
            color: #1a8a45;
        }

        .add-message.error {
            color: #d90429;
        }

        /* Holiday Table */
        .holiday-table-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(30, 60, 40, 0.08);
            overflow: hidden;
        }

        .holiday-table th {
            background-color: transparent;
            color: #a0bba6;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #edf6ef;
            padding: 16px 20px;
        }

        .holiday-table td {
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #3d5045;
            border-bottom: 1px solid #edf6ef;
            vertical-align: middle;
        }

        .holiday-table tr:last-child td {
            border-bottom: none;
        }

        .holiday-type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .type-regular {
            background: #fff3e0;
            color: #e65100;
        }

        .type-special_non_working {
            background: #ede7f6;
            color: #5e35b1;
        }

        .type-special_working {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .type-company {
            background: #e3f2fd;
            color: #0277bd;
        }

        .recurring-badge {
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .btn-action-sm {
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            padding: 7px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
            margin-right: 4px;
        }

        .btn-edit {
            background: #e3f2fd;
            color: #0277bd;
        }

        .btn-edit:hover {
            background: #bbdefb;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #fde2e2;
            color: #d90429;
        }

        .btn-delete:hover {
            background: #f8b4b4;
            transform: translateY(-1px);
        }

        .btn-save-edit {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .btn-save-edit:hover {
            background: #c8e6c9;
        }

        .btn-cancel-edit {
            background: #f5f5f5;
            color: #666;
        }

        .btn-cancel-edit:hover {
            background: #e0e0e0;
        }

        .edit-input {
            border: 2px solid #2bcf74;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            width: 100%;
            outline: none;
        }

        .edit-select {
            border: 2px solid #2bcf74;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            width: 100%;
            outline: none;
            background: #fff;
        }

        .holiday-count-badge {
            background: #2bcf74;
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            margin-left: 12px;
        }

        /* Logout */
        .btn-logout {
            background: none;
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 6px 18px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #fff;
        }

        .brand-header {
            position: relative;
        }

        /* Confirm modal */
        .confirm-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .confirm-overlay.show {
            display: flex;
        }

        .confirm-box {
            background: #fff;
            border-radius: 20px;
            padding: 35px 40px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            animation: fadeUp 0.3s ease;
        }

        .confirm-title {
            font-size: 18px;
            font-weight: 800;
            color: #1a3c2a;
            margin-bottom: 8px;
        }

        .confirm-text {
            font-size: 14px;
            color: #748c77;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .confirm-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .confirm-btn-yes {
            background: #d90429;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 10px 28px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }

        .confirm-btn-yes:hover {
            background: #b80325;
        }

        .confirm-btn-no {
            background: #f0f0f0;
            color: #555;
            border: none;
            border-radius: 12px;
            padding: 10px 28px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }

        .confirm-btn-no:hover {
            background: #e0e0e0;
        }
    </style>
</head>

<body>

    <!-- Login Gate -->
    <div id="loginGate" class="login-gate">
        <div class="login-card">
            <div class="login-icon">🔐</div>
            <div class="login-title">Admin Access</div>
            <div class="login-subtitle">Enter password to manage holidays</div>
            <input type="password" id="adminPassword" class="login-input" placeholder="Enter admin password"
                autocomplete="off">
            <button id="loginBtn" class="login-btn" onclick="attemptLogin()">Unlock</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <!-- Admin Panel (hidden until login) -->
    <div id="adminPanel" class="admin-panel">

        <!-- Header -->
        <div class="brand-header">
            <button class="btn-logout" onclick="logout()">🔒 Logout</button>
            <img src="assets/images/logo.jpg" alt="ECOZONE Logo" class="brand-logo">
            <h1>ECOZONE</h1>
            <div class="subtitle">Holiday Management — Admin</div>
            <div id="liveClock" class="live-clock"></div>
        </div>

        <div class="main-container main-container-wide">
            <div class="mb-4">
                <a href="attendance.html" class="nav-link-back">&larr; Back to Attendance Logs</a>
            </div>

            <!-- Holiday Today Notice -->
            <div id="holidayTodayCard" class="holiday-today-card">
                <span>🏖️</span> <span id="holidayTodayText"></span>
            </div>

            <!-- Add Holiday Form -->
            <div class="add-form-card">
                <div class="add-form-header">➕ Add New Holiday</div>
                <div class="add-form-body">
                    <div class="form-row-grid">
                        <div class="form-group-mini">
                            <label for="addName">Holiday Name</label>
                            <input type="text" id="addName" placeholder="e.g. Christmas Day" maxlength="200">
                        </div>
                        <div class="form-group-mini">
                            <label for="addDate">Date</label>
                            <input type="date" id="addDate">
                        </div>
                        <div class="form-group-mini">
                            <label for="addType">Type</label>
                            <select id="addType">
                                <option value="REGULAR">Regular Holiday</option>
                                <option value="SPECIAL_NON_WORKING">Special Non-Working</option>
                                <option value="SPECIAL_WORKING">Special Working</option>
                                <option value="COMPANY">Company Holiday</option>
                            </select>
                        </div>
                        <button class="btn-add" id="addBtn" onclick="addHoliday()">Add Holiday</button>
                    </div>
                    <div id="addMessage" class="add-message"></div>
                </div>
            </div>

            <!-- Holidays Table -->
            <div class="holiday-table-card">
                <div class="table-header-bar">
                    <h5>
                        📋 Holiday Calendar
                        <span id="holidayCount" class="holiday-count-badge">0</span>
                    </h5>
                </div>
                <div class="table-responsive">
                    <table class="holiday-table table" id="holidayTable">
                        <thead>
                            <tr>
                                <th>Holiday Name</th>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Recurring</th>
                                <th style="text-align:right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="holidayTableBody">
                        </tbody>
                    </table>
                </div>
                <p id="holidayStatus" class="text-center mb-0" style="padding:18px; display:none;"></p>
            </div>

            <div class="footer-text">ECOZONE Attendance System &copy; 2026</div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="confirmOverlay" class="confirm-overlay">
        <div class="confirm-box">
            <div class="confirm-title">Delete Holiday?</div>
            <div id="confirmText" class="confirm-text">Are you sure you want to remove this holiday?</div>
            <div class="confirm-btns">
                <button class="confirm-btn-no" onclick="cancelDelete()">Cancel</button>
                <button class="confirm-btn-yes" id="confirmYesBtn" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="libs/bootstrap.bundle.min.js"></script>
    <script>
        // =============================================
        // Clock
        // =============================================
        var clockDisplay = document.getElementById('liveClock');
        function updateClock() {
            var now = new Date();
            var dateStr = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            var timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            clockDisplay.textContent = dateStr + '  •  ' + timeStr;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // =============================================
        // Login
        // =============================================
        var loginGate = document.getElementById('loginGate');
        var adminPanel = document.getElementById('adminPanel');
        var passwordInput = document.getElementById('adminPassword');
        var loginError = document.getElementById('loginError');
        var loginBtn = document.getElementById('loginBtn');

        // Enter key on password field
        passwordInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') attemptLogin();
        });

        function attemptLogin() {
            var pwd = passwordInput.value.trim();
            if (!pwd) {
                loginError.textContent = 'Please enter the admin password.';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying...';
            loginError.textContent = '';

            fetch('api/admin_auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Unlock';

                    if (data.success) {
                        // Save session in memory (not persistent — logout on refresh is fine)
                        sessionStorage.setItem('eco_admin', '1');
                        showAdminPanel();
                    } else {
                        loginError.textContent = data.message || 'Invalid password.';
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                })
                .catch(function (err) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Unlock';
                    loginError.textContent = 'Connection error: ' + err;
                });
        }

        function showAdminPanel() {
            loginGate.style.display = 'none';
            adminPanel.style.display = 'block';
            loadHolidays();
            checkTodayHoliday();
        }

        function logout() {
            sessionStorage.removeItem('eco_admin');
            adminPanel.style.display = 'none';
            loginGate.style.display = 'flex';
            passwordInput.value = '';
            loginError.textContent = '';
        }

        // Auto-login if session exists
        if (sessionStorage.getItem('eco_admin') === '1') {
            showAdminPanel();
        }

        // =============================================
        // Holiday Today Check
        // =============================================
        function checkTodayHoliday() {
            fetch('api/holidays.php?check_today=1')
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    if (d.is_holiday) {
                        var card = document.getElementById('holidayTodayCard');
                        var text = document.getElementById('holidayTodayText');
                        text.textContent = 'TODAY IS A ' + d.holiday_type.replace(/_/g, ' ') + ' — ' + d.holiday_name + '. Attendance will be tagged accordingly.';
                        card.style.display = 'block';
                        if (d.holiday_type !== 'REGULAR') card.classList.add('special');
                    }
                })
                .catch(function () { });
        }

        // =============================================
        // Load Holidays
        // =============================================
        var holidayTableBody = document.getElementById('holidayTableBody');
        var holidayCount = document.getElementById('holidayCount');
        var holidayStatus = document.getElementById('holidayStatus');
        var allHolidays = [];

        function loadHolidays() {
            holidayTableBody.innerHTML = '';
            holidayStatus.textContent = 'Loading holidays...';
            holidayStatus.style.display = 'block';

            fetch('api/holidays.php')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.success) {
                        allHolidays = data.data;
                        renderHolidays(allHolidays);
                    } else {
                        holidayStatus.textContent = 'Error: ' + data.message;
                    }
                })
                .catch(function (err) {
                    holidayStatus.textContent = 'Connection error: ' + err;
                });
        }

        function renderHolidays(holidays) {
            holidayTableBody.innerHTML = '';

            if (holidays.length === 0) {
                holidayStatus.textContent = 'No holidays configured. Add one above!';
                holidayStatus.style.display = 'block';
                holidayCount.textContent = '0';
                return;
            }

            holidayStatus.style.display = 'none';
            holidayCount.textContent = holidays.length;

            var typeLabels = {
                'REGULAR': 'Regular Holiday',
                'SPECIAL_NON_WORKING': 'Special Non-Working',
                'SPECIAL_WORKING': 'Special Working',
                'COMPANY': 'Company Holiday'
            };

            for (var i = 0; i < holidays.length; i++) {
                var h = holidays[i];
                var row = document.createElement('tr');
                row.id = 'row-' + h.holiday_id;

                // Name
                var nameCell = document.createElement('td');
                nameCell.textContent = h.holiday_name;
                nameCell.className = 'cell-name';
                nameCell.style.fontWeight = '700';

                // Date
                var dateCell = document.createElement('td');
                var dateObj = new Date(h.holiday_date + 'T00:00:00');
                dateCell.textContent = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                // Type badge
                var typeCell = document.createElement('td');
                var typeBadge = document.createElement('span');
                typeBadge.className = 'holiday-type-badge type-' + h.holiday_type.toLowerCase();
                typeBadge.textContent = typeLabels[h.holiday_type] || h.holiday_type;
                typeCell.appendChild(typeBadge);

                // Recurring
                var recurCell = document.createElement('td');
                if (h.is_recurring == 1 || h.is_recurring === true || h.is_recurring === '1') {
                    var rBadge = document.createElement('span');
                    rBadge.className = 'recurring-badge';
                    rBadge.textContent = '♻️ Yearly';
                    recurCell.appendChild(rBadge);
                } else {
                    recurCell.textContent = h.year_specific ? h.year_specific + ' only' : '—';
                    recurCell.style.color = '#a0bba6';
                }

                // Actions
                var actCell = document.createElement('td');
                actCell.style.textAlign = 'right';
                actCell.style.whiteSpace = 'nowrap';

                var editBtn = document.createElement('button');
                editBtn.className = 'btn-action-sm btn-edit';
                editBtn.textContent = '✏️ Edit';
                editBtn.setAttribute('data-id', h.holiday_id);
                editBtn.onclick = (function (holiday) {
                    return function () { startEdit(holiday); };
                })(h);

                var delBtn = document.createElement('button');
                delBtn.className = 'btn-action-sm btn-delete';
                delBtn.textContent = '🗑️ Delete';
                delBtn.setAttribute('data-id', h.holiday_id);
                delBtn.onclick = (function (holiday) {
                    return function () { requestDelete(holiday); };
                })(h);

                actCell.appendChild(editBtn);
                actCell.appendChild(delBtn);

                row.appendChild(nameCell);
                row.appendChild(dateCell);
                row.appendChild(typeCell);
                row.appendChild(recurCell);
                row.appendChild(actCell);
                holidayTableBody.appendChild(row);
            }
        }

        // =============================================
        // Add Holiday
        // =============================================
        var addMessage = document.getElementById('addMessage');
        var addBtn = document.getElementById('addBtn');

        function addHoliday() {
            var name = document.getElementById('addName').value.trim();
            var date = document.getElementById('addDate').value;
            var type = document.getElementById('addType').value;

            if (!name) { showAddMsg('Please enter a holiday name.', 'error'); return; }
            if (!date) { showAddMsg('Please select a date.', 'error'); return; }

            addBtn.disabled = true;
            addBtn.textContent = 'Adding...';

            var formData = new FormData();
            formData.append('holiday_name', name);
            formData.append('holiday_date', date);
            formData.append('holiday_type', type);
            formData.append('is_recurring', '0');
            // Set year_specific from the date
            var yearVal = date.split('-')[0];
            formData.append('year_specific', yearVal);

            fetch('api/holidays.php', { method: 'POST', body: formData })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    addBtn.disabled = false;
                    addBtn.textContent = 'Add Holiday';

                    if (data.success) {
                        showAddMsg('✅ ' + name + ' added successfully!', 'success');
                        document.getElementById('addName').value = '';
                        document.getElementById('addDate').value = '';
                        loadHolidays();
                        checkTodayHoliday();
                    } else {
                        showAddMsg('❌ ' + data.message, 'error');
                    }
                })
                .catch(function (err) {
                    addBtn.disabled = false;
                    addBtn.textContent = 'Add Holiday';
                    showAddMsg('❌ Connection error: ' + err, 'error');
                });
        }

        function showAddMsg(msg, type) {
            addMessage.textContent = msg;
            addMessage.className = 'add-message ' + type;
            setTimeout(function () { addMessage.textContent = ''; }, 4000);
        }

        // =============================================
        // Edit Holiday (Inline)
        // =============================================
        var editingId = null;

        function startEdit(holiday) {
            // If already editing, cancel
            if (editingId) cancelEdit();

            editingId = holiday.holiday_id;
            var row = document.getElementById('row-' + editingId);
            if (!row) return;

            var cells = row.querySelectorAll('td');

            // Name
            cells[0].innerHTML = '<input type="text" class="edit-input" id="editName" value="' + escHtml(holiday.holiday_name) + '">';

            // Date
            cells[1].innerHTML = '<input type="date" class="edit-input" id="editDate" value="' + holiday.holiday_date + '">';

            // Type
            var typeOptions = [
                ['REGULAR', 'Regular Holiday'],
                ['SPECIAL_NON_WORKING', 'Special Non-Working'],
                ['SPECIAL_WORKING', 'Special Working'],
                ['COMPANY', 'Company Holiday']
            ];
            var selectHtml = '<select class="edit-select" id="editType">';
            for (var i = 0; i < typeOptions.length; i++) {
                var sel = typeOptions[i][0] === holiday.holiday_type ? ' selected' : '';
                selectHtml += '<option value="' + typeOptions[i][0] + '"' + sel + '>' + typeOptions[i][1] + '</option>';
            }
            selectHtml += '</select>';
            cells[2].innerHTML = selectHtml;

            // Recurring — keep as is
            cells[3].textContent = '';

            // Actions
            cells[4].innerHTML = '';
            var saveBtn = document.createElement('button');
            saveBtn.className = 'btn-action-sm btn-save-edit';
            saveBtn.textContent = '💾 Save';
            saveBtn.onclick = function () { saveEdit(holiday); };

            var cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn-action-sm btn-cancel-edit';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = function () { cancelEdit(); };

            cells[4].appendChild(saveBtn);
            cells[4].appendChild(cancelBtn);
        }

        function cancelEdit() {
            editingId = null;
            renderHolidays(allHolidays);
        }

        function saveEdit(original) {
            var name = document.getElementById('editName').value.trim();
            var date = document.getElementById('editDate').value;
            var type = document.getElementById('editType').value;

            if (!name || !date) { return; }

            var body = 'holiday_id=' + original.holiday_id
                + '&holiday_name=' + encodeURIComponent(name)
                + '&holiday_date=' + encodeURIComponent(date)
                + '&holiday_type=' + encodeURIComponent(type)
                + '&is_recurring=' + (original.is_recurring ? '1' : '0')
                + '&year_specific=' + (original.year_specific || date.split('-')[0]);

            fetch('api/holidays.php', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    editingId = null;
                    if (data.success) {
                        showAddMsg('✅ Holiday updated!', 'success');
                        loadHolidays();
                    } else {
                        showAddMsg('❌ ' + data.message, 'error');
                        renderHolidays(allHolidays);
                    }
                })
                .catch(function (err) {
                    editingId = null;
                    showAddMsg('❌ Error: ' + err, 'error');
                    renderHolidays(allHolidays);
                });
        }

        // =============================================
        // Delete Holiday
        // =============================================
        var pendingDeleteId = null;
        var confirmOverlay = document.getElementById('confirmOverlay');
        var confirmText = document.getElementById('confirmText');

        function requestDelete(holiday) {
            pendingDeleteId = holiday.holiday_id;
            confirmText.textContent = 'Delete "' + holiday.holiday_name + '" (' + holiday.holiday_date + ')?';
            confirmOverlay.classList.add('show');
        }

        function cancelDelete() {
            pendingDeleteId = null;
            confirmOverlay.classList.remove('show');
        }

        function confirmDelete() {
            if (!pendingDeleteId) return;

            confirmOverlay.classList.remove('show');

            fetch('api/holidays.php?id=' + pendingDeleteId, { method: 'DELETE' })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    pendingDeleteId = null;
                    if (data.success) {
                        showAddMsg('🗑️ Holiday deleted.', 'success');
                        loadHolidays();
                    } else {
                        showAddMsg('❌ ' + data.message, 'error');
                    }
                })
                .catch(function (err) {
                    pendingDeleteId = null;
                    showAddMsg('❌ Error: ' + err, 'error');
                });
        }

        // Helper
        function escHtml(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }
    </script>
</body>

</html>
