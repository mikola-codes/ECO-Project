<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOZONE - Live Kiosk</title>
    <meta name="description" content="ECOZONE Fingerprint Attendance System — Live Kiosk">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.7);
            --surface-glass: rgba(255, 255, 255, 0.5);
            --brand: #10b981;
            --brand-dark: #059669;
            --brand-glow: rgba(16, 185, 129, 0.25);
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: rgba(0, 0, 0, 0.08);
            --danger: #ef4444;
        }
        [data-theme="dark"] {
            --bg: #09090b;
            --surface: rgba(24, 24, 27, 0.6);
            --surface-glass: rgba(24, 24, 27, 0.5);
            --brand: #34d399;
            --brand-dark: #10b981;
            --brand-glow: rgba(52, 211, 153, 0.15);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s, color 0.3s;
        }

        /* ═══ Ambient Background ═══ */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; overflow: hidden; pointer-events: none;
        }
        .ambient-blob {
            position: absolute; filter: blur(100px); opacity: 0.12; border-radius: 50%;
            animation: ambientFloat 20s infinite ease-in-out alternate;
        }
        .ambient-blob-1 { top: -10%; right: -10%; width: 50vw; height: 50vw; background: var(--brand); }
        .ambient-blob-2 { bottom: -20%; left: -10%; width: 40vw; height: 40vw; background: #0ea5e9; animation-delay: -5s; }
        [data-theme="dark"] .ambient-blob { opacity: 0.05; }
        @keyframes ambientFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-50px, 50px) scale(1.1); }
        }

        .ambient-core {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 80vw; max-width: 800px; max-height: 800px;
            background: radial-gradient(circle, var(--brand-glow) 0%, transparent 60%);
            filter: blur(80px); opacity: 0.5; z-index: 1; pointer-events: none;
        }

        /* ═══ Navbar — Identical to landing.html ═══ */
        nav {
            position: fixed; top: 0; width: 100%; height: 80px; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            background: rgba(255,255,255,0.8); border-bottom: 1px solid var(--border);
        }
        [data-theme="dark"] nav { background: rgba(9,9,11,0.8); }
        .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-main); font-weight: 800; font-size: 18px; letter-spacing: 0.05em; }
        .nav-logo { width: 32px; height: 32px; border-radius: 8px; }
        .nav-actions { display: flex; align-items: center; gap: 12px; }
        .nav-actions a {
            color: var(--text-main); text-decoration: none; font-size: 14px; font-weight: 600;
            padding: 10px 24px; background: rgba(0,0,0,0.05); border: 1px solid var(--border);
            border-radius: 100px; transition: all 0.3s;
        }
        .nav-actions a:hover { background: var(--brand); color: #fff; transform: scale(1.05); }
        [data-theme="dark"] .nav-actions a { background: rgba(255,255,255,0.05); }
        .theme-toggle {
            background: transparent; border: 1px solid var(--border); border-radius: 100px;
            padding: 8px 16px; cursor: pointer; color: var(--text-main); font-size: 16px; transition: all 0.3s;
        }
        .theme-toggle:hover { background: var(--brand-glow); }
        .nav-clock { color: var(--text-muted); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }

        /* ═══ Holiday Banner ═══ */
        .holiday-banner {
            position: fixed; top: 80px; left: 0; width: 100%; display: none;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #fff;
            text-align: center; padding: 12px 20px; font-weight: 700; font-size: 14px;
            letter-spacing: 0.05em; z-index: 999; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .holiday-banner.special { background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%); }
        .holiday-banner.company { background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%); }

        /* ═══ Main Layout ═══ */
        .kiosk-main {
            flex: 1; display: flex; align-items: center; justify-content: center;
            position: relative; padding: 120px 24px 40px;
        }

        .kiosk-card {
            position: relative; z-index: 10; width: 100%; max-width: 380px; text-align: center;
            padding: 32px 24px; border-radius: 24px;
            background: var(--surface); border: 1px solid var(--border);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }
        .kiosk-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
        }
        [data-theme="dark"] .kiosk-card {
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        [data-theme="dark"] .kiosk-card:hover {
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        /* ═══ Scanner ═══ */
        .scanner-wrapper { position: relative; width: 100px; height: 100px; margin: 0 auto 20px; cursor: pointer; }
        .scanner-icon {
            width: 100%; height: 100%; color: var(--brand);
            filter: drop-shadow(0 0 12px var(--brand-glow));
            animation: breathe 3s ease-in-out infinite alternate;
            position: relative; z-index: 2;
        }
        @keyframes breathe {
            0% { filter: drop-shadow(0 0 8px var(--brand-glow)); transform: scale(0.98); }
            100% { filter: drop-shadow(0 0 30px var(--brand)); transform: scale(1.02); }
        }
        .scanner-wrapper.scanning .scanner-icon {
            animation: scanIntense 0.5s ease-in-out infinite alternate; color: var(--brand);
        }
        @keyframes scanIntense {
            0% { filter: drop-shadow(0 0 20px var(--brand)); }
            100% { filter: drop-shadow(0 0 50px var(--brand)); }
        }
        .scanner-wrapper.scanning::after {
            content: ''; position: absolute; top: -20px; left: -20px; right: -20px; bottom: -20px;
            border-radius: 50%; background: conic-gradient(from 0deg, transparent 70%, var(--brand) 100%);
            animation: spinRadar 1s linear infinite; z-index: 1; opacity: 0.3;
        }
        @keyframes spinRadar { 100% { transform: rotate(360deg); } }

        /* ═══ Typography — Matching landing.html ═══ */
        .kiosk-title {
            font-size: clamp(24px, 4vw, 32px); font-weight: 800;
            letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 8px;
            background: linear-gradient(135deg, #059669 0%, #34d399 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .kiosk-desc {
            font-size: clamp(14px, 1.5vw, 15px); color: var(--text-muted);
            font-weight: 500; line-height: 1.5; margin-bottom: 24px;
        }

        /* ═══ Button — Same as landing.html .btn-primary ═══ */
        .btn-kiosk {
            background: var(--text-main); color: #fff; border: none;
            padding: 14px 32px; border-radius: 100px; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all 0.3s; display: inline-flex;
            align-items: center; justify-content: center; gap: 8px; width: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
                .btn-kiosk:hover { transform: scale(1.05); background: var(--brand); }
        .btn-kiosk-outline { background: transparent !important; color: var(--text-main) !important; border: 2px solid var(--text-main); }
        .btn-kiosk-outline:hover { background: var(--text-main) !important; color: var(--bg) !important; }
        [data-theme="dark"] .btn-kiosk { background: #f4f4f5; color: #09090b; }
        [data-theme="dark"] .btn-kiosk:hover { background: var(--brand); color: #fff; }
        [data-theme="dark"] .btn-kiosk-outline { border-color: #f4f4f5; color: #f4f4f5 !important; }
        [data-theme="dark"] .btn-kiosk-outline:hover { background: #f4f4f5 !important; color: #09090b !important; }

        .hint { margin-top: 20px; font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .result-box {
            margin-top: 32px; font-weight: 700; font-size: 16px; border-radius: 16px;
            transition: all 0.3s;
        }

        /* ═══ Badge Pills ═══ */
        .badge-pill { padding: 6px 16px; border-radius: 100px; font-size: 13px; font-weight: 800; letter-spacing: 0.05em; display: inline-block; text-transform: uppercase; }
        .dt-field { background: rgba(16, 185, 129, 0.1); color: var(--brand-dark); border: 1px solid rgba(16,185,129,0.2); }
        .dt-override { background: rgba(0,0,0,0.05); color: var(--text-muted); border: 1px solid var(--border); }
        [data-theme="dark"] .dt-override { background: rgba(255,255,255,0.05); }

        .holiday-verify-notice { margin-top: 12px; padding: 10px 16px; border-radius: 12px; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); font-size: 14px; color: var(--brand-dark); font-weight: 700; }
        .holiday-verify-notice.special { color: #2563eb; background: rgba(37,99,235,0.1); border-color: rgba(37,99,235,0.2); }

        .spinner { border: 2px solid rgba(255,255,255,0.3); border-top-color: currentColor; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ═══ Responsive ═══ */
        @media (max-width: 768px) {
            nav { padding: 0 20px; height: 64px; }
            .kiosk-main { padding-top: 100px; }
            .kiosk-card { padding: 40px 24px; border-radius: 24px; }
            .scanner-wrapper { width: 120px; height: 120px; }
            .nav-clock { display: none; }
        }
    </style>
</head>
<body>
    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="ambient-blob ambient-blob-1"></div>
        <div class="ambient-blob ambient-blob-2"></div>
    </div>

    <!-- Navbar — Identical to landing.html -->
    <nav>
        <a href="landing.html" class="nav-brand">
            <img src="assets/images/logo.jpg" alt="ECOZONE" class="nav-logo">
            ECOZONE
        </a>
        <div class="nav-actions">
            <div id="liveClock" class="nav-clock"></div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode"><span id="themeIcon">🌙</span></button>
            <a href="about.html">Developers</a>
            <a href="admin.html">Admin Console</a>
        </div>
    </nav>

    <!-- Holiday Banner -->
    <div id="holidayBanner" class="holiday-banner">
        <span>🏖️</span>
        <span id="holidayBannerText"></span>
    </div>

    <!-- Main Kiosk Content -->
    <main class="kiosk-main">
        <div class="ambient-core"></div>

        <div class="kiosk-card">
            <div class="scanner-wrapper" id="fingerprintIcon" onclick="document.getElementById('verifyBtn').click()">
                <svg class="scanner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10"/><path d="M5 12c0-3.866 3.134-7 7-7s7 3.134 7 7"/><path d="M8 12c0-2.209 1.791-4 4-4s4 1.791 4 4"/><path d="M11 12c0-.552.448-1 1-1s1 .448 1 1"/><path d="M12 22C6.477 22 2 17.523 2 12"/><path d="M12 19c-3.866 0-7-3.134-7-7"/><path d="M12 16c-2.209 0-4-1.791-4-4"/><path d="M12 13c-.552 0-1-.448-1-1"/>
                </svg>
            </div>

            <h1 class="kiosk-title">Live Attendance</h1>
            <p class="kiosk-desc">Place any enrolled finger on the scanner and click the button below to time in or out securely.</p>

                        <button id="verifyBtn" class="btn-kiosk">
                <span class="btn-text">Authenticate Finger</span>
                <span class="btn-spinner" style="display:none; align-items: center;"><span class="spinner" style="margin-right: 8px;"></span> Scanning...</span>
            </button>
            <a href="enroll.html" class="btn-kiosk btn-kiosk-outline" style="margin-top: 16px; text-decoration: none;">
                <span class="btn-text">Enroll New Identity</span>
            </a>
            <div class="hint">Please ensure your finger is placed firmly on the glass.</div>

            <div id="verifyMessage" class="result-box"></div>
        </div>
    </main>

    <script>
        // =============================================
        // Theme Toggle (self-contained)
        // =============================================
        var html = document.documentElement;
        var themeBtn = document.getElementById('themeToggle');
        var themeIconEl = document.getElementById('themeIcon');

        if (localStorage.getItem('eco-theme') === 'dark') {
            html.setAttribute('data-theme', 'dark');
            if (themeIconEl) themeIconEl.textContent = '☀️';
        }
        if (themeBtn) {
            themeBtn.addEventListener('click', function () {
                var isDark = html.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    html.removeAttribute('data-theme');
                    localStorage.setItem('eco-theme', 'light');
                    if (themeIconEl) themeIconEl.textContent = '🌙';
                } else {
                    html.setAttribute('data-theme', 'dark');
                    localStorage.setItem('eco-theme', 'dark');
                    if (themeIconEl) themeIconEl.textContent = '☀️';
                }
            });
        }

        // =============================================
        // Live Clock
        // =============================================
        var clockEl = document.getElementById('liveClock');
        if (clockEl) {
            function tick() {
                var n = new Date();
                clockEl.textContent =
                    n.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) +
                    '  •  ' +
                    n.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }
            tick();
            setInterval(tick, 1000);
        }

        // =============================================
        // Holiday Banner
        // =============================================
        var holidayBanner = document.getElementById('holidayBanner');
        var holidayBannerText = document.getElementById('holidayBannerText');
        var todayHoliday = null;

        fetch('api/holidays.php?check_today=1')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.is_holiday) {
                    todayHoliday = data;
                    holidayBannerText.textContent = 'TODAY IS A ' + data.holiday_type.replace(/_/g, ' ') + ' HOLIDAY — ' + data.holiday_name + '. Attendance scans will be tagged accordingly.';
                    holidayBanner.style.display = 'block';
                    if (data.holiday_type === 'SPECIAL_NON_WORKING' || data.holiday_type === 'SPECIAL_WORKING') {
                        holidayBanner.classList.add('special');
                    } else if (data.holiday_type === 'COMPANY') {
                        holidayBanner.classList.add('company');
                    }
                }
            })
            .catch(function () { /* banner stays hidden on error */ });

        // =============================================
        // Button loading helper
        // =============================================
        function setButtonLoading(btn, loading) {
            var txt = btn.querySelector('.btn-text');
            var spin = btn.querySelector('.btn-spinner');
            if (loading) { txt.style.display = 'none'; spin.style.display = 'inline-flex'; btn.disabled = true; }
            else { txt.style.display = 'inline'; spin.style.display = 'none'; btn.disabled = false; }
        }

        // =============================================
        // Verification Logic
        // =============================================
        var verifyBtn = document.getElementById('verifyBtn');
        var verifyMessage = document.getElementById('verifyMessage');
        var fingerprintIcon = document.getElementById('fingerprintIcon');

        verifyBtn.addEventListener('click', function () {
            verifyMessage.innerHTML = '👆 Scanning... Hold finger steady.';
            verifyMessage.style.padding = '20px';
            verifyMessage.style.background = 'var(--surface)';
            verifyMessage.style.border = '1px solid var(--border)';
            verifyMessage.style.color = 'var(--text-main)';
            setButtonLoading(verifyBtn, true);

            fingerprintIcon.classList.add('scanning');

            fetch('api/verify.php', { method: 'POST' })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    setButtonLoading(verifyBtn, false);
                    fingerprintIcon.classList.remove('scanning');
                    
                    if (data.success) {
                        var typeLabel = data.log_type === 'TIME_IN' ? 'TIMED IN' : 'TIMED OUT';
                        var badgeClass = data.log_type === 'TIME_IN' ? 'badge-pill dt-field' : 'badge-pill dt-override';
                        var holidayNotice = '';
                        if (data.is_holiday && data.holiday_name) {
                            var noticeClass = (data.holiday_type === 'SPECIAL_NON_WORKING' || data.holiday_type === 'SPECIAL_WORKING') ? 'holiday-verify-notice special' : 'holiday-verify-notice';
                            holidayNotice = '<div class="' + noticeClass + '">🏖️ ' + data.holiday_name + ' — ' + data.holiday_type.replace(/_/g, ' ') + '</div>';
                        }
                        
                        verifyMessage.style.background = 'rgba(16,185,129,0.05)';
                        verifyMessage.style.borderColor = 'rgba(16,185,129,0.2)';
                        verifyMessage.innerHTML =
                            '<div style="font-size:20px; margin-bottom:8px;">✅ Success</div>' +
                            '<div style="font-weight:800; font-size:24px; color:var(--text-main); margin-bottom:4px; letter-spacing:-0.02em;">' + data.nickname + '</div>' +
                            '<div style="color:var(--text-muted); font-size:14px; margin-bottom:16px;">Employee ID: ' + data.employee_id + '</div>' +
                            '<div><span class="' + badgeClass + '">' + typeLabel + '</span></div>' +
                            '<div style="margin-top:16px; font-size:13px; color:var(--text-muted); font-weight:600;">' + data.log_time + '</div>' +
                            holidayNotice;
                        
                        showFeedbackModal('success', 'Verified: ' + data.nickname, `${typeLabel} at ${data.log_time}`, true);
                      } else {
                          var errorText = data.message;
                          if (errorText.includes("No device attached")) {
                              errorText = "No device found. Please attach the device to the computer.";
                          }
                          verifyMessage.style.background = 'rgba(239,68,68,0.05)';
                          verifyMessage.style.borderColor = 'rgba(239,68,68,0.2)';
                          verifyMessage.style.color = 'var(--danger)';
                          verifyMessage.innerHTML = `<span style="font-weight: 600; font-size: 16px;">❌ ${errorText}</span>`;
                          showFeedbackModal('error', 'Device Not Found', errorText, false);
                      }
                  })
                  .catch(function (err) {
                      setButtonLoading(verifyBtn, false);
                      fingerprintIcon.classList.remove('scanning');
                      verifyMessage.style.background = 'rgba(239,68,68,0.05)';
                      verifyMessage.style.borderColor = 'rgba(239,68,68,0.2)';
                      verifyMessage.style.color = 'var(--danger)';
                      
                      let errStr = err.toString();
                      if (errStr.includes('Failed to fetch') || errStr.includes('NetworkError') || errStr.includes('Unexpected token')) {
                          verifyMessage.innerHTML = '<span style="font-weight: 600; font-size: 16px;">❌ No device found. Please attach the device to the computer.</span>';
                          showFeedbackModal('error', 'Device Not Found', "No device found. Please attach the device to the computer.", false);
                      } else {
                          verifyMessage.innerHTML = '<span style="font-weight: 600; font-size: 16px;">❌ Connection error: ' + err + '</span>';
                          showFeedbackModal('error', 'System Error', err.message || err, false);
                      }
                  });
        });
        function showFeedbackModal(type, title, text, autoClose) {
            var modal = document.getElementById('scanFeedbackModal');
            var card = document.getElementById('scanFeedbackCard');
            var icon = document.getElementById('scanFeedbackIcon');
            var titleEl = document.getElementById('scanFeedbackTitle');
            var textEl = document.getElementById('scanFeedbackText');
            var btn = document.getElementById('scanFeedbackBtn');
            
            if (type === 'success') {
                icon.innerHTML = '?';
                card.style.border = '1px solid rgba(34, 197, 94, 0.3)';
                btn.style.background = 'var(--brand)';
                btn.style.display = 'none';
            } else {
                icon.innerHTML = '?';
                card.style.border = '1px solid rgba(239, 68, 68, 0.4)';
                btn.style.background = 'var(--surface-light)';
                btn.style.color = '#fff';
                btn.style.display = 'block';
            }
            
            titleEl.textContent = title;
            textEl.textContent = text;
            
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                card.style.transform = 'scale(1)';
            }, 10);
            
            if (autoClose) {
                setTimeout(() => {
                    closeFeedbackModal();
                }, 3000); // Wait 3 seconds for attendance success so they can read it
            }
        }
        
        function closeFeedbackModal() {
            var modal = document.getElementById('scanFeedbackModal');
            var card = document.getElementById('scanFeedbackCard');
            modal.style.opacity = '0';
            card.style.transform = 'scale(0.9)';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }
    </script>
    <!-- Scan Feedback Modal -->
    <div id="scanFeedbackModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 9999; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;">
        <div id="scanFeedbackCard" class="kiosk-card" style="max-width: 320px; padding: 32px 24px; background: rgba(20, 20, 20, 0.95); box-shadow: 0 24px 64px rgba(0,0,0,0.5); border-radius: 20px; text-align: center; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
            <div id="scanFeedbackIcon" style="font-size: 48px; margin-bottom: 20px;"></div>
            <h2 id="scanFeedbackTitle" style="margin: 0 0 12px 0; color: #fff; font-size: 24px; font-weight: 700;"></h2>
            <p id="scanFeedbackText" style="color: rgba(255,255,255,0.7); line-height: 1.5; margin: 0 0 24px 0; font-size: 15px;"></p>
            <button id="scanFeedbackBtn" class="btn-kiosk" onclick="closeFeedbackModal()" style="background: var(--brand); color: #000; font-weight: 600; border: none; width: 100%;">OK</button>
        </div>
    </div>
</body>
</html>
